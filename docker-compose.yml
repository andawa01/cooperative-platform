services:
  db:
    image: postgres:16-alpine
    container_name: shambatrack_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: shamba
      POSTGRES_PASSWORD: shamba_dev_password
      POSTGRES_DB: shambatrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-compose-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shamba -d shambatrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shambatrack_redis
    restart: unless-stopped
    # We deliberately do NOT enable Redis persistence (RDB/AOF).
    # See D-024: the notification history lives in Postgres. Redis holds
    # operational dispatch state, which is fine to lose on restart.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: