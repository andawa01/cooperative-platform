# CI pipeline for ShambaTrack.
# Runs on push/PR to any branch. Backend tests require a Postgres service
# container; frontend just needs Node for build + lint.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── Backend: lint + test ─────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shamba
          POSTGRES_PASSWORD: shamba_dev_password
          POSTGRES_DB: shambatrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shamba -d shambatrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://shamba:shamba_dev_password@localhost:5432/shambatrack_test
      DATABASE_URL_TEST: postgresql+psycopg://shamba:shamba_dev_password@localhost:5432/shambatrack_test
      JWT_SECRET_KEY: ci-secret-key-that-is-long-enough-for-hs256-validation-check
      REDIS_URL: redis://localhost:6379/0
      LOG_JSON: "false"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        working-directory: backend
        run: ruff check app/ scripts/

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check app/ scripts/

      - name: Run migrations
        working-directory: backend
        run: |
          alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: pytest -x -q

  # ── Frontend: lint + build ──────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
