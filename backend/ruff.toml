# Ruff configuration for ShambaTrack backend.
# Docs: https://docs.astral.sh/ruff/configuration/

target-version = "py312"
line-length = 88
extend-exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
]

[lint]
# Rule sets enabled:
#   E   — pycodestyle errors
#   W   — pycodestyle warnings
#   F   — pyflakes (unused imports, undefined names, etc.)
#   I   — isort (import sorting)
#   UP  — pyupgrade (modernize syntax for 3.12)
#   B   — flake8-bugbear (likely-bug patterns)
select = ["E", "W", "F", "I", "UP", "B"]

ignore = [
    # FastAPI's dependency injection pattern requires calling Depends() and
    # Query() in function argument defaults — this is the intended API.
    "B008",
    # `raise ... from err` is explicitly omitted in auth paths to avoid leaking
    # internal exception chains to callers. See D-014.
    "B904",
    # `contextlib.suppress()` vs `try/except: pass` — explicit pass is used
    # intentionally here with comments explaining the blast-radius decision.
    "B007",
    # SIM is not enabled — simplify rules are too opinionated for this codebase.
]

[lint.per-file-ignores]
# Alembic migration files are autogenerated — skip line-length and other
# style rules. We only want pyflakes (F) checks on them.
"app/db/migrations/versions/*.py" = ["E501", "W", "F811", "F841", "B", "I", "UP"]
