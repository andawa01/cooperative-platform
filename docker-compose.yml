services:
  db:
    image: postgres:16-alpine
    container_name: shambatrack_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: shamba
      POSTGRES_PASSWORD: shamba_dev_password
      POSTGRES_DB: shambatrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shamba -d shambatrack"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: